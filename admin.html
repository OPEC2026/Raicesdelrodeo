<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración | Raíces del Rodeo</title><style>*{box-sizing:border-box}body{margin:0;background:#f5ecdf;color:#39271e;font:16px system-ui}header{background:#513528;color:#fff;padding:24px}main{max-width:960px;margin:auto;padding:24px}section,form{background:#fffaf2;border:1px solid #d8c4ad;border-radius:10px;padding:20px;margin-bottom:20px}label{display:block;margin:12px 0}input,textarea{display:block;width:100%;padding:11px;border:1px solid #bca58e;border-radius:5px;font:inherit}button{background:#805039;color:white;border:0;border-radius:5px;padding:11px 18px;font:inherit;cursor:pointer}button:disabled{opacity:.5}article{border-top:1px solid #ddd;padding:14px 0;overflow-wrap:anywhere}h1,h2{font-family:Georgia,serif}#estado{white-space:pre-wrap} [hidden]{display:none!important}</style><header><h1>Raíces del Rodeo</h1>Panel de administración</header><main><p id="estado" role="status" aria-live="polite"></p><form id="login"><h2>Acceso privado</h2><label>Contraseña<input name="clave" type="password" required autocomplete="current-password"></label><button>Ingresar</button></form><div id="panel" hidden><button id="salir">Cerrar sesión</button><form id="evento"><h2>Agregar evento</h2><label>Título<input name="titulo" required></label><label>Fecha<input name="fecha" type="date" required></label><label>Hora<input name="hora" type="time"></label><label>Lugar<input name="lugar"></label><label>Descripción<textarea name="descripcion"></textarea></label><label>URL de imagen<input name="imagen" type="url"></label><button>Guardar evento</button></form><section><h2>Agenda registrada</h2><div id="agenda"></div></section><form id="noticia"><h2>Publicar noticia</h2><label>Título<input name="titulo" required></label><label>Contenido<textarea name="contenido" required></textarea></label><label>URL de imagen<input name="imagen" type="url"></label><button>Publicar noticia</button></form><section><h2>Noticias registradas</h2><div id="noticias"></div></section></div></main><script>
const API='https://script.google.com/macros/s/AKfycbz8zizOCAU8Xenq41zBOZwnQ6r2xdfMF3LV9atEPCFcHdxvM06xGJWWRBn0s_TAU78x/exec';
const $=id=>document.getElementById(id);let clave='',busy=false;
async function api(accion,data={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({...data,accion,clave})});if(!r.ok)throw Error('Error de conexión');const j=await r.json();if(!j.ok)throw Error(j.mensaje||'Operación rechazada');return j;}
async function run(fn){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);$('estado').textContent='Procesando…';try{await fn();$('estado').textContent='Operación completada.'}catch(e){$('estado').textContent=e.message||'No se pudo conectar.'}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
function render(id,items,accion){const root=$(id);root.replaceChildren();if(!items.length)root.textContent='Sin publicaciones.';for(const item of items){const a=document.createElement('article'),t=document.createElement('strong'),p=document.createElement('p'),b=document.createElement('button');t.textContent=item.titulo;p.textContent=item.fecha+' · '+(item.activo==='SI'?'Visible':'Oculto');b.textContent=item.activo==='SI'?'Desactivar':'Activar';b.onclick=()=>run(async()=>{await api(accion,{fila:item.fila});await cargar()});a.append(t,p,b);root.append(a)}}
async function cargar(){const d=await api('listar_admin');render('agenda',d.agenda,'toggle_activo_agenda');render('noticias',d.noticias,'toggle_activo_noticia')}
$('login').onsubmit=e=>{e.preventDefault();run(async()=>{clave=new FormData(e.target).get('clave');try{await api('verificar_admin');await cargar();$('login').reset();$('login').hidden=true;$('panel').hidden=false}catch(err){clave='';throw err}})};
$('salir').onclick=()=>{clave='';$('panel').hidden=true;$('login').hidden=false;$('agenda').replaceChildren();$('noticias').replaceChildren();$('estado').textContent='Sesión cerrada.'};
for(const [id,accion] of [['evento','agregar_evento'],['noticia','agregar_noticia']]){$(id).onsubmit=e=>{e.preventDefault();run(async()=>{await api(accion,Object.fromEntries(new FormData(e.target)));e.target.reset();await cargar()})}}
</script></html>
